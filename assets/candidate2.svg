<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="skinGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="suitGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad2)" />
  <circle cx="200" cy="200" r="185" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-dasharray="10 5" opacity="0.6"/>

  <!-- Body / Suit -->
  <g filter="url(#shadow2)">
    <!-- Shoulders -->
    <path d="M 70 400 C 85 270, 150 245, 200 245 C 250 245, 315 270, 330 400 Z" fill="url(#suitGrad2)"/>
    <!-- Shirt -->
    <path d="M 170 250 L 200 330 L 230 250 Z" fill="#ffffff" />
    <!-- Tie -->
    <path d="M 193 255 L 207 255 L 212 360 L 200 380 L 188 360 Z" fill="#dc2626" />
    <!-- Lapels -->
    <path d="M 150 250 L 190 350 L 165 400 L 110 400 Z" fill="#1e293b" />
    <path d="M 250 250 L 210 350 L 235 400 L 290 400 Z" fill="#1e293b" />
    <!-- Badge -->
    <circle cx="160" cy="330" r="12" fill="#059669" stroke="#ffffff" stroke-width="2"/>
    <text x="160" y="334" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">202</text>
  </g>

  <!-- Neck -->
  <rect x="175" y="195" width="50" height="65" rx="8" fill="#fed7aa" />
  <!-- Shadow under chin -->
  <path d="M 175 210 Q 200 230 225 210 Z" fill="#ea580c" opacity="0.4"/>

  <!-- Head -->
  <ellipse cx="200" cy="160" rx="60" ry="70" fill="#ffedd5" />

  <!-- Hair -->
  <path d="M 135 150 C 135 85, 265 85, 265 150 C 265 140, 260 110, 240 100 C 210 90, 180 90, 155 105 C 140 115, 135 135, 135 150 Z" fill="#475569" />
  <!-- Sideburns -->
  <rect x="138" y="145" width="8" height="25" rx="3" fill="#475569" />
  <rect x="254" y="145" width="8" height="25" rx="3" fill="#475569" />

  <!-- Eyes -->
  <ellipse cx="178" cy="155" rx="6" ry="5" fill="#1e293b" />
  <ellipse cx="222" cy="155" rx="6" ry="5" fill="#1e293b" />
  <circle cx="180" cy="153" r="2" fill="#ffffff" />
  <circle cx="224" cy="153" r="2" fill="#ffffff" />

  <!-- Eyebrows -->
  <path d="M 166 145 Q 178 140 190 146" stroke="#334155" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 210 146 Q 222 140 234 145" stroke="#334155" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <path d="M 200 155 L 196 175 L 205 175" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Smile / Mouth -->
  <path d="M 184 195 Q 200 208 216 195" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Subtle Beard / Goatee -->
  <path d="M 190 208 Q 200 216 210 208 Q 200 220 190 208" fill="#64748b" opacity="0.6"/>
</svg>
