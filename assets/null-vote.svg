<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradNull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="shadowNull" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGradNull)" />
  <circle cx="200" cy="200" r="185" fill="none" stroke="#fca5a5" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Ballot Box / Envelope Illustration with Null/Void Cross -->
  <g filter="url(#shadowNull)">
    <!-- Envelope Body -->
    <rect x="100" y="140" width="200" height="140" rx="12" fill="#f8fafc" stroke="#dc2626" stroke-width="4"/>
    <!-- Diagonal Cross Lines (indicating void / nulo) -->
    <line x1="108" y1="148" x2="292" y2="272" stroke="#ef4444" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <line x1="292" y1="148" x2="108" y2="272" stroke="#ef4444" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    
    <!-- Central Stamp -->
    <circle cx="200" cy="210" r="32" fill="#991b1b" stroke="#ffffff" stroke-width="3"/>
    <text x="200" y="217" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">NULO</text>
  </g>

  <!-- Ribbon -->
  <rect x="130" y="300" width="140" height="32" rx="16" fill="#450a0a" />
  <text x="200" y="321" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fecaca" text-anchor="middle">VOTO NULO</text>
</svg>
